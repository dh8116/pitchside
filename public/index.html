<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pitchside</title>
  <meta name="description" content="Open-source go-to-market coach you text like a friend">
  <meta name="theme-color" content="#f7f7f7">
  <link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" type="module"></script>
</head>
<body>
  <header class="top">
    <button id="chats" class="link chats-btn" type="button" aria-haspopup="true" aria-expanded="false" title="Earlier conversations">Chats</button>
    <div class="contact">
      <img src="favicon.svg" alt="" width="44" height="44">
      <strong>Pitchside</strong>
    </div>
    <button id="new" class="link" title="Start a new conversation">New</button>
  </header>

  <nav id="sessions" class="sessions" hidden aria-label="Earlier conversations"></nav>

  <main id="scroll" class="scroll">
    <div class="column">
      <form id="gate" class="gate" hidden>
        <p>This Pitchside is private. Enter the passcode to chat.</p>
        <input id="passcode" type="password" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode">
        <button type="submit">Unlock</button>
        <p id="gate-error" class="gate-error"></p>
      </form>
      <section id="empty" class="empty">
        <p>Text your coach what you're working on, or start with one of these.</p>
        <div id="chips" class="chips" aria-label="Suggestions"></div>
      </section>
      <div id="log" class="log" aria-live="polite"></div>
    </div>
  </main>

  <footer class="dock">
    <form id="form" class="composer column">
      <textarea id="input" rows="1" placeholder="Text Message" aria-label="Message"></textarea>
      <button type="submit" id="send" class="send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 4.5 5.5 11l1.4 1.4L11 8.3V20h2V8.3l4.1 4.1 1.4-1.4z"/></svg>
      </button>
    </form>
    <p class="hint">Chat here, or text Pitchside on WhatsApp, iMessage, SMS or email.</p>
  </footer>
</body>
</html>
