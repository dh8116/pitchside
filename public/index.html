<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pitchside</title>
  <meta name="description" content="Open-source go-to-market coach you text like a friend">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" type="module"></script>
</head>
<body>
  <header class="top">
    <strong><img src="favicon.svg" alt="" width="24" height="24">Pitchside</strong>
    <button id="new" class="ghost" title="Start a new conversation">New chat</button>
  </header>

  <main id="scroll" class="scroll">
    <div class="column">
      <section id="empty" class="empty">
        <h1>What are you working on?</h1>
        <div id="chips" class="chips" aria-label="Suggestions"></div>
      </section>
      <div id="log" class="log" aria-live="polite"></div>
    </div>
  </main>

  <footer class="dock">
    <form id="form" class="composer column">
      <textarea id="input" rows="1" placeholder="Message Pitchside" aria-label="Message"></textarea>
      <button type="submit" id="send" class="send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 4.5 5.5 11l1.4 1.4L11 8.3V20h2V8.3l4.1 4.1 1.4-1.4z"/></svg>
      </button>
    </form>
    <p class="hint">Local test chat. In real use you text Pitchside on WhatsApp, iMessage, SMS or email.</p>
  </footer>
</body>
</html>
